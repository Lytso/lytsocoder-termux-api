name: Build & Publish Signed LytsoCoder:API Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore Keystore from Secret
        run: |
          if [ -z "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "Error: RELEASE_KEYSTORE_BASE64 secret is missing in GitHub repository settings."
            exit 1
          fi
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > app/release.jks

      - name: Extract Version Info
        id: version
        run: |
          CURRENT_VERSION_NAME_REGEX='\s+versionName "([^"]+)"$'
          CURRENT_VERSION_NAME="$(grep -m 1 -E "$CURRENT_VERSION_NAME_REGEX" ./app/build.gradle | sed -r "s/$CURRENT_VERSION_NAME_REGEX/\1/")"
          TAG_NAME="v${CURRENT_VERSION_NAME}-${GITHUB_SHA:0:7}"
          echo "tag=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "version_name=$CURRENT_VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Build Signed Release APK
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD || '123456' }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || 'lytsocoder' }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || '123456' }}
        run: |
          chmod +x gradlew
          mkdir -p release_output
          VERSION="${{ steps.version.outputs.version_name }}"
          LYTSO_TARGET_PKG=lytso.code ./gradlew assembleRelease
          find app/build/outputs/apk/release/ -name "*.apk" -exec cp {} "release_output/lytsocoder-termux-api-v${VERSION}.apk" \;
          cp "release_output/lytsocoder-termux-api-v${VERSION}.apk" "release_output/lytsocoder-termux-api.apk"
          (cd release_output && sha256sum *.apk > checksums-sha256.txt)

      - name: Organize Release Artifacts
        id: artifacts
        run: |
          VERSION="${{ steps.version.outputs.version_name }}"
          echo "apk_name=lytsocoder-termux-api-v${VERSION}.apk" >> $GITHUB_OUTPUT

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifacts.outputs.apk_name }}
          path: release_output/*

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: LytsoCoder:API v${{ steps.version.outputs.version_name }}
          body: |
            Signed LytsoCoder:API companion APK (`lytso.code.api`) for LytsoCoder (`lytso.code`).

            - Version: v${{ steps.version.outputs.version_name }}
            - Commit: ${{ github.sha }}
            - Direct APK: `lytsocoder-termux-api.apk`
          draft: false
          prerelease: false
          files: release_output/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
